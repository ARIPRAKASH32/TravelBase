<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trip Details | TravelBase</title>
    <link rel="stylesheet" href="../assets/css/tb-design-system.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=2.2">
    <link rel="stylesheet" href="../assets/css/dashboard.css?v=2.2">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script defer src="../assets/js/main.js?v=3.3"></script>
    <script defer src="../assets/js/packages.js?v=3.3"></script>
    <style>
      /* ── Package Details cinematic hero ── */
      .page-hero--cinematic {
        position: relative;
        height: 320px;
        display: flex;
        align-items: center;
        background: url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=2000&q=85') center center / cover no-repeat;
        overflow: hidden;
      }
      .page-hero--cinematic::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(20,38,30,0.80) 0%, rgba(20,38,30,0.50) 60%, rgba(20,38,30,0.25) 100%);
      }
      .page-hero--cinematic .hero-inner {
        position: relative;
        z-index: 1;
      }
      .page-hero--cinematic .eyebrow {
        color: var(--tb-gold);
        display: block;
        margin-bottom: 8px;
      }
      .page-hero--cinematic h1 {
        font-family: var(--font-serif);
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        color: #fff;
        line-height: 1.15;
        margin: 0;
      }
      .breadcrumb-light {
        font-family: var(--font-sans);
        font-size: 0.8rem;
        color: rgba(255,255,255,0.65);
        margin-bottom: 20px;
      }
      .breadcrumb-light a {
        color: rgba(255,255,255,0.75);
        text-decoration: none;
      }
      .breadcrumb-light a:hover { color: var(--tb-gold); }

      /* ── Detail container & loading state ── */
      .details-layout {
        min-height: 320px;
        padding-top: 48px;
        padding-bottom: 64px;
      }
      .details-layout:empty::after {
        content: '';
        display: flex;
      }
      /* Loading dots shown while JS renders */
      .detail-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 0;
        gap: 8px;
      }
      .detail-loading span {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--tb-deep-green);
        opacity: 0.4;
        animation: pulse-dot 1.2s ease-in-out infinite;
      }
      .detail-loading span:nth-child(2) { animation-delay: 0.2s; }
      .detail-loading span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse-dot {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body data-root="..">
    <header id="site-header">
    </header>
    <main>
      <!-- Cinematic page hero with breadcrumb -->
      <section class="page-hero--cinematic">
        <div class="container hero-inner">
          <div class="breadcrumb-light">
            <a href="../index.html">Home</a>
            &rsaquo;
            <a href="packages.html">Packages</a>
            &rsaquo; Trip details
          </div>
          <span class="eyebrow">A closer look</span>
          <h1>Find the details that make a trip yours</h1>
        </div>
      </section>

      <!-- JS renders the full detail inside #package-detail -->
      <section class="section" style="padding-top:0;">
        <div class="container details-layout" id="package-detail">
          <!-- Loading indicator — JS removes this when content is injected -->
          <div class="detail-loading" aria-label="Loading trip details…">
            <span></span><span></span><span></span>
          </div>
        </div>
      </section>
    </main>
    <footer id="site-footer" class="site-footer">
    </footer>
  </body>
</html>
