<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Bookings | TravelBase</title>
    <link rel="stylesheet" href="../../assets/css/tb-design-system.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css?v=3.3">
    <link rel="stylesheet" href="../../assets/css/dashboard.css?v=3.3">
    <link rel="stylesheet" href="../../assets/css/responsive.css?v=3.1">
    <script defer src="../../assets/js/main.js?v=3.3"></script>
    <script defer src="../../assets/js/admin.js?v=3.6"></script>
  </head>
  <body data-root="../.." data-role="admin" data-section="bookings">
    <div id="dashboard-shell">
    </div>
    <main class="app-main">
      <div class="app-titlebar">
        <div>
          <h1>Bookings</h1>
          <p>Review and manage verified customer reservations and status updates.</p>
        </div>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input id="table-search" class="control admin-search" type="search" placeholder="Search booking, customer or package" aria-label="Search bookings">
        </div>
        <div class="table-wrap">
          <table id="data-table">
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Customer</th>
                <th>Package</th>
                <th>Travel date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated dynamically from verified customer bookings -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
