<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | TravelBase Private Client Access</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
    <link rel="stylesheet" href="../assets/css/style.css?v=2.2">
    <link rel="stylesheet" href="../assets/css/dashboard.css?v=2.2">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script defer src="../assets/js/main.js?v=2.2"></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body data-root="..">
    <main class="auth-page">
      <!-- Left Panel: Cinematic Imagery with High Contrast Text -->
      <section class="auth-image" style="background-image: linear-gradient(180deg, rgba(12, 25, 18, 0.35) 0%, rgba(12, 25, 18, 0.92) 100%), url('https://images.unsplash.com/photo-1526495124232-a04e1849168c?auto=format&fit=crop&w=1400&q=85');">
        <div class="auth-image-brand">
          <a href="../index.html">
            <img src="../assets/img/logo-light.svg" alt="TravelBase" height="42" style="display: block;">
          </a>
        </div>
        <div class="auth-image-copy">
          <span class="eyebrow" style="color: #E5D18A; background: rgba(0, 0, 0, 0.45); border-color: rgba(229, 209, 138, 0.35); padding: 6px 16px; margin-bottom: 16px;">Membership</span>
          <h2>Make room for<br><em>the journey.</em></h2>
          <p>Join TravelBase to unlock personalized itineraries, private retreat access, and direct consultation with senior travel curators.</p>
        </div>
      </section>

      <!-- Right Panel: Refined Form Experience -->
      <section class="auth-panel">
        <div class="auth-box">
          <a class="brand" href="../index.html" style="display: inline-block; margin-bottom: 8px;">
            <img src="../assets/img/logo-dark.svg" alt="TravelBase" height="46" style="display: block;">
          </a>
          <h1>Create your account</h1>
          <p>A few details to begin planning your bespoke journey.</p>

          <div id="form-message" hidden></div>

          <form class="auth-form" id="register-form" method="post" action="/register" novalidate>
            <div class="field">
              <label for="name">Full Name</label>
              <input id="name" name="name" required autocomplete="name" placeholder="Alex Morgan">
            </div>
            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" required autocomplete="email" placeholder="alex.morgan@example.com">
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="+91 98765 43210">
            </div>
            <div class="field">
              <label for="password">Password <small class="text-muted">(min 8 characters)</small></label>
              <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Create a secure password">
            </div>
            <div class="field">
              <label for="confirm-password">Confirm Password</label>
              <input id="confirm-password" name="confirmPassword" type="password" required autocomplete="new-password" placeholder="Confirm your password">
            </div>
            <button class="btn btn-primary" type="submit">Create Private Account</button>
          </form>

          <p style="margin-top: 24px; font-size: 0.95rem; color: var(--tb-muted);">
            Already have an account? <a href="/login" style="color: var(--tb-deep-green); font-weight: 700; text-decoration: underline;">Log in</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
