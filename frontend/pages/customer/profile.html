<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | TravelBase</title>
    <link rel="stylesheet" href="../../assets/css/tb-design-system.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css?v=3.4">
    <link rel="stylesheet" href="../../assets/css/dashboard.css?v=3.4">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <script defer src="../../assets/js/main.js?v=3.4"></script>
    <script defer src="../../assets/js/admin.js?v=3.5"></script>
    <script defer src="../../assets/js/booking.js?v=3.5"></script>
    <style>
      /* Profile page premium styling */
      .app-titlebar {
        margin-bottom: var(--space-8);
        padding-bottom: var(--space-6);
        border-bottom: 1px solid var(--tb-line);
      }
      .app-titlebar h1 {
        font-family: var(--font-serif);
        font-size: var(--text-2xl);
        color: var(--tb-ink);
        margin: 0 0 var(--space-1);
        font-weight: 600;
      }
      .app-titlebar p {
        color: var(--tb-muted);
        margin: 0;
        font-size: var(--text-sm);
      }

      /* Profile card */
      .profile-card {
        max-width: 760px;
        background: #fff;
        border-radius: var(--radius-lg);
        border: 1px solid var(--tb-line);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      /* Avatar header */
      .profile-avatar-section {
        display: flex;
        align-items: center;
        gap: var(--space-5);
        padding: var(--space-6) var(--space-8);
        background: var(--tb-paper);
        border-bottom: 1px solid var(--tb-line);
      }
      .avatar-circle {
        width: 80px;
        height: 80px;
        border-radius: var(--radius-full);
        background: var(--tb-deep-green);
        color: var(--tb-gold);
        font-family: var(--font-serif);
        font-size: 2rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        box-shadow: 0 4px 16px rgba(47, 78, 62, 0.22);
      }
      .avatar-info h2 {
        font-family: var(--font-serif);
        font-size: var(--text-xl);
        color: var(--tb-ink);
        margin: 0 0 var(--space-1);
        font-weight: 600;
      }
      .avatar-info p {
        color: var(--tb-muted);
        margin: 0;
        font-size: var(--text-sm);
      }

      /* Profile message */
      #profile-message {
        margin: var(--space-5) var(--space-8) 0;
        border-radius: var(--radius-md);
        padding: var(--space-4) var(--space-5);
        font-size: var(--text-sm);
      }
      #profile-message:not([hidden]) { display: block; }

      /* Form sections */
      .form-section {
        padding: var(--space-6) var(--space-8);
      }
      .form-section + .form-section {
        border-top: 1px solid var(--tb-line);
      }
      .form-section-label {
        font-family: var(--font-sans);
        font-size: var(--text-xs);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--tb-gold);
        margin-bottom: var(--space-5);
        display: block;
      }

      /* Form grid */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-4) var(--space-5);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .field label {
        font-family: var(--font-sans);
        font-size: var(--text-xs);
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--tb-muted);
      }
      .field input {
        border: 1.5px solid var(--tb-line);
        border-radius: var(--radius-md);
        padding: 10px 14px;
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        color: var(--tb-charcoal);
        background: #fff;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        outline: none;
      }
      .field input[readonly] {
        background: var(--tb-paper);
        color: var(--tb-muted);
        cursor: default;
      }
      .field input:focus:not([readonly]) {
        border-color: var(--tb-deep-green);
        box-shadow: 0 0 0 3px rgba(47, 78, 62, 0.08);
      }

      /* Actions */
      .profile-actions {
        padding: var(--space-5) var(--space-8) var(--space-6);
        border-top: 1px solid var(--tb-line);
        display: flex;
        gap: var(--space-3);
        align-items: center;
      }
      #edit-profile {
        flex: 1;
        padding: 11px;
        border: 1.5px solid var(--tb-deep-green);
        color: var(--tb-deep-green);
        background: transparent;
        border-radius: var(--radius-md);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        font-weight: 500;
        cursor: pointer;
        transition: background var(--transition-fast), color var(--transition-fast);
      }
      #edit-profile:hover { background: var(--tb-paper); }
      #save-profile {
        flex: 2;
        padding: 11px;
        background: var(--tb-deep-green);
        color: #fff;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        font-weight: 600;
        cursor: pointer;
        transition: background var(--transition-fast), opacity var(--transition-fast);
      }
      #save-profile:hover:not(:disabled) { background: var(--tb-mid-green, #3D6150); }
      #save-profile:disabled { opacity: 0.45; cursor: not-allowed; }

      .notice {
        padding: var(--space-4) var(--space-8);
        font-size: var(--text-xs);
        color: var(--tb-muted);
        background: var(--tb-ivory);
        border-top: 1px solid var(--tb-line);
        line-height: 1.6;
      }

      /* Wide field (full-width in grid) */
      .wide { grid-column: 1 / -1; }

      @media (max-width: 640px) {
        .form-grid { grid-template-columns: 1fr; }
        .profile-avatar-section { padding: var(--space-5); }
        .form-section { padding: var(--space-5); }
        .profile-actions { padding: var(--space-5); flex-direction: column; }
        #edit-profile, #save-profile { width: 100%; }
      }
    </style>
  </head>
  <body data-root="../.." data-role="customer" data-section="profile">
    <div id="dashboard-shell">
    </div>
    <main class="app-main">
      <div class="app-titlebar">
        <div>
          <h1>My profile</h1>
          <p>Keep your contact details up to date for your travel plans.</p>
        </div>
      </div>

      <div class="profile-card panel" style="max-width:760px">
        <!-- Avatar header -->
        <div class="profile-avatar-section">
          <div class="avatar-circle" id="profile-avatar-initials">DT</div>
          <div class="avatar-info">
            <h2 id="profile-display-name">Traveler</h2>
            <p id="profile-display-meta">Member &nbsp;·&nbsp; TravelBase</p>
          </div>
        </div>

        <div id="profile-message" hidden>
        </div>

        <form id="profile-form">
          <!-- Personal info section -->
          <div class="form-section">
            <span class="form-section-label">Personal information</span>
            <div class="form-grid">
              <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" required autocomplete="name" value="Alex Morgan" readonly>
              </div>
              <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" required autocomplete="email" value="alex.morgan@example.com" readonly>
              </div>
            </div>
          </div>

          <!-- Contact details section -->
          <div class="form-section">
            <span class="form-section-label">Contact details</span>
            <div class="form-grid">
              <div class="field">
                <label for="phone">Phone number</label>
                <input id="phone" name="phone" type="tel" required autocomplete="tel" value="+1 503 555 0142" readonly>
              </div>
              <div class="field">
                <label for="address">Address</label>
                <input id="address" name="address" autocomplete="street-address" value="Pune, Maharashtra" readonly>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="profile-actions">
            <button class="btn btn-outline" id="edit-profile" type="button">Edit profile</button>
            <button class="btn btn-primary" id="save-profile" type="submit" disabled>Save changes</button>
          </div>
        </form>

        <p class="notice">Your profile details are kept up to date for all journey bookings.</p>
      </div>
    </main>
  </body>
</html>
